<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bullet Shell</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #020617; overflow: hidden; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; text-align: center;
        background: #020617; color: #e2e8f0; font: 600 20px/1.4 system-ui, sans-serif; padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
